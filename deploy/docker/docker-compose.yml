name: sfmshop

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "8000:8000"
      - "9100:9100"
    environment:
        DB_HOST: db
        DB_PORT: 5432
        DB_NAME: ${DB_NAME}
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}

        DB_REPLICA_HOST: db
        DB_REPLICA_PORT: 5432
        DB_REPLICA_NAME: ${DB_REPLICA_NAME}
        DB_REPLICA_USER: ${DB_REPLICA_USER}
        DB_REPLICA_PASSWORD: ${DB_REPLICA_PASSWORD}

        REDIS_HOST: redis
        REDIS_PORT: 6379
        REDIS_DB: 0

        MONGO_URL: mongodb://mongo:27017
        RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/

        JWT_SECRET: ${JWT_SECRET}
        CORS_ORIGINS: ${CORS_ORIGINS}
        RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN}
        RATE_LIMIT_STORAGE_URI: redis://redis:6379/0

        LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
        LLM_MODEL: ${LLM_MODEL:-}
        ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
        OPENAI_API_KEY: ${OPENAI_API_KEY:-}

        PAYMENT_SERVICE_URL: http://payment:8001
        PAYMENT_SERVICE_TOKEN: ${PAYMENT_SERVICE_TOKEN:?set PAYMENT_SERVICE_TOKEN in .env}

        SMTP_HOST: ${SMTP_HOST:-mailpit}
        SMTP_PORT: ${SMTP_PORT:-1025}
        SMTP_START_TLS: ${SMTP_START_TLS:-false}
        SMTP_USERNAME: ${SMTP_USERNAME:-}
        SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      payment:
        condition: service_healthy
    volumes:
      - ../../sfmshop:/app/sfmshop

  payment:
    build:
      context: ../../payment_service
    environment:
      PAYMENT_DB_HOST: payment-db
      PAYMENT_DB_PORT: 5432
      PAYMENT_DB_NAME: payment_db
      PAYMENT_DB_USER: ${PAYMENT_DB_USER:-postgres}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?set PAYMENT_DB_PASSWORD in .env}
      PAYMENT_SERVICE_TOKEN: ${PAYMENT_SERVICE_TOKEN:?set PAYMENT_SERVICE_TOKEN in .env}
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/ready')" ]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      payment-db:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.31.3
    ports:
      - "8025:8025"

  payment-db:
    image: postgres:17
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: ${PAYMENT_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:?set PAYMENT_DB_PASSWORD in .env}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PAYMENT_DB_USER:-postgres} -d payment_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - payment_postgres_data:/var/lib/postgresql/data

  db:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 10

    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 10s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - app
      - payment
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.34.1
    ports:
      - "9093:9093"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        config=default;
        if [ -n "$$TELEGRAM_BOT_TOKEN" ] && [ -n "$$TELEGRAM_CHAT_ID" ]; then
        umask 077 && mkdir -p /tmp/telegram &&
        printf '%s' "$$TELEGRAM_BOT_TOKEN" > /tmp/telegram/bot_token &&
        printf '%s' "$$TELEGRAM_CHAT_ID" > /tmp/telegram/chat_id &&
        config=telegram; fi;
        echo "alertmanager config: $$config";
        exec /bin/alertmanager --config.file=/etc/alertmanager/$$config.yml --storage.path=/alertmanager
    volumes:
      - ../alertmanager:/etc/alertmanager:ro

  grafana:
    image: grafana/grafana:13.2.3
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sfmshop-service.json
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  payment_postgres_data:
