name: CI/CD Pipeline

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: sfmshop_test
      DB_USER: postgres
      DB_PASSWORD: postgres

    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sfmshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff==0.15.21
          ruff check sfmshop/ tests/

      - name: Type check with mypy
        run: |
          pip install mypy==2.3.0
          mypy sfmshop/ --ignore-missing-imports

      - name: Check alert rules
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" -w /etc/prometheus --entrypoint promtool prom/prometheus:v3.5.0 check config prometheus.yml
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" -w /etc/prometheus --entrypoint promtool prom/prometheus:v3.5.0 test rules alerts_test.yml

      - name: Check migrations
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: Run tests
        env:
          RUN_MIGRATION_TESTS: "1"
        run: |
          pytest --cov=sfmshop --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          load: true
          tags: sfmshop:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run --rm --entrypoint pip sfmshop:ci check
          docker run --rm --entrypoint python sfmshop:ci -c "import sfmshop.api.main"

      - name: Build payment-service image
        uses: docker/build-push-action@v6
        with:
          context: payment_service
          push: false
          load: true
          tags: sfmshop-payment:ci
          cache-from: type=gha,scope=payment
          cache-to: type=gha,mode=max,scope=payment

      - name: Smoke test payment-service image
        run: |
          docker run --rm --entrypoint pip sfmshop-payment:ci check
          docker run --rm --entrypoint python sfmshop-payment:ci -c "import payment.main"

  payment-service:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: payment_service

    env:
      PAYMENT_DB_HOST: localhost
      PAYMENT_DB_PORT: 5432
      PAYMENT_DB_USER: postgres
      PAYMENT_DB_PASSWORD: postgres
      PAYMENT_DB_NAME: payment_test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff==0.15.21
          ruff check .

      - name: Type check with mypy
        run: |
          pip install mypy==2.3.0
          mypy payment/ --ignore-missing-imports

      - name: Run tests
        run: pytest --cov=payment

  integration:
    runs-on: ubuntu-latest

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: sfmshop_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_REPLICA_HOST: localhost
      DB_REPLICA_PORT: 5432
      DB_REPLICA_NAME: sfmshop_test
      DB_REPLICA_USER: postgres
      DB_REPLICA_PASSWORD: postgres
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/
      MONGO_URL: mongodb://localhost:27017
      RUN_INTEGRATION_TESTS: "1"
      PAYMENT_SERVICE_URL: http://localhost:8001
      PAYMENT_SERVICE_TOKEN: ci-payment-token
      PAYMENT_DB_HOST: localhost
      PAYMENT_DB_PORT: 5432
      PAYMENT_DB_USER: postgres
      PAYMENT_DB_PASSWORD: postgres
      PAYMENT_DB_NAME: payment_db
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_START_TLS: "false"
      MAILPIT_URL: http://localhost:8025

    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sfmshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.31.3
        ports:
          - 1025:1025
          - 8025:8025
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply migrations
        run: alembic upgrade head

      - name: Start payment-service
        working-directory: payment_service
        run: |
          pip install -r requirements.txt
          PGPASSWORD=postgres createdb -h localhost -U postgres payment_db
          alembic upgrade head
          nohup uvicorn payment.main:app --port 8001 > payment.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8001/health/ready && exit 0
            sleep 1
          done
          cat payment.log
          exit 1

      - name: Run integration tests
        run: pytest tests/integration -v

      - name: Payment-service log
        if: failure()
        run: cat payment_service/payment.log

  deploy:
    needs: [ test, build, payment-service, integration ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}

    steps:
      - uses: actions/checkout@v4

      - name: Prepare image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          cache-from: type=gha
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Build and push payment-service image
        uses: docker/build-push-action@v6
        with:
          context: payment_service
          push: true
          cache-from: type=gha,scope=payment
          tags: |
            ${{ env.IMAGE_NAME }}-payment:latest
            ${{ env.IMAGE_NAME }}-payment:${{ github.sha }}

      - name: Deploy over SSH
        if: env.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/sfmshop
            docker compose pull
            docker compose up -d