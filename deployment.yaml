apiVersion: apps/v1
kind: Deployment
metadata:
  name: sfmshop-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sfmshop
  template:
    metadata:
      labels:
        app: sfmshop
    spec:
      containers:
        - name: app
          image: sfmshop:latest
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: sfmshop-secrets
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: sfmshop-secrets
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: sfmshop-secrets
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: sfmshop-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sfmshop-secrets
                  key: DB_PASSWORD
            - name: DB_REPLICA_HOST
              valueFrom:
                secretKeyRef:
                  name: sfmshop-secrets
                  key: DB_REPLICA_HOST
            - name: DB_REPLICA_PORT
              valueFrom:
                secretKeyRef:
                  name: sfmshop-secrets
                  key: DB_REPLICA_PORT
            - name: DB_REPLICA_NAME
              valueFrom:
                secretKeyRef:
                  name: sfmshop-secrets
                  key: DB_REPLICA_NAME
            - name: DB_REPLICA_USER
              valueFrom:
                secretKeyRef:
                  name: sfmshop-secrets
                  key: DB_REPLICA_USER
            - name: DB_REPLICA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sfmshop-secrets
                  key: DB_REPLICA_PASSWORD
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: sfmshop-secrets
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: sfmshop-secrets
                  key: REDIS_PORT
            - name: REDIS_DB
              valueFrom:
                secretKeyRef:
                  name: sfmshop-secrets
                  key: REDIS_DB
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: sfmshop-secrets
                  key: MONGO_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: sfmshop-secrets
                  key: RABBITMQ_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sfmshop-secrets
                  key: JWT_SECRET
            - name: CORS_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: sfmshop-secrets
                  key: CORS_ORIGINS
            - name: RATE_LIMIT_LOGIN
              valueFrom:
                secretKeyRef:
                  name: sfmshop-secrets
                  key: RATE_LIMIT_LOGIN